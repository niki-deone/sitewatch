# .github/workflows/checks.yml
# Triggers the SiteWatch scheduler every 5 minutes.
# Vercel's free plan only allows one cron run per day, so GitHub Actions does the frequent part.
# Needs two repository secrets: APP_URL (e.g. https://sitewatch.vercel.app) and CRON_SECRET.
name: Run monitor checks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sitewatch-checks
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is missing" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/check"
